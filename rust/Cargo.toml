[workspace]
members = [
    "crates/natsuzora",
    "crates/natsuzora-contract",
    "crates/natsuzora-difftest",
]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.74"
description = "Minimal template language for safe HTML generation"
license = "MIT"
repository = "https://github.com/takahashim/natsuzora"
keywords = ["template", "html", "static-site"]
categories = ["template-engine", "web-programming"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
